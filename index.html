<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja de Camisas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>⚽🏀 Camisas Esportivas</h1>
    <nav>
      <ul>
        <li><a href="#">Início</a></li>
        <li><a href="#">Futebol</a></li>
        <li><a href="#">NBA</a></li>
        <li><a href="#">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="produtos">
      <h2>Camisas em Destaque</h2>
      <div class="grid">
        <div class="produto">
          <img src="https://via.placeholder.com/250x250?text=Camisa+Futebol+1" alt="Camisa Futebol 1" />
          <h3>Camisa Brasil</h3>
          <p>R$ 149,90</p>
          <button onclick="comprar('Camisa Brasil')">Comprar</button>
        </div>
        <div class="produto">
          <img src="https://via.placeholder.com/250x250?text=Camisa+NBA+1" alt="Camisa NBA 1" />
          <h3>Camisa Lakers</h3>
          <p>R$ 199,90</p>
          <button onclick="comprar('Camisa Lakers')">Comprar</button>
        </div>
        <div class="produto">
          <img src="https://via.placeholder.com/250x250?text=Camisa+Futebol+2" alt="Camisa Futebol 2" />
          <h3>Camisa Real Madrid</h3>
          <p>R$ 179,90</p>
          <button onclick="comprar('Camisa Real Madrid')">Comprar</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Camisas Esportivas. Todos os direitos reservados.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
